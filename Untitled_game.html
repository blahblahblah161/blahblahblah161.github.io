<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Parry unlimited</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
      color: white;
    }
    canvas {
      display: block;
      margin: auto;
      background: #222;
      border: 2px solid white;
    }
    #gameOver {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 3em;
      display: none;
      color: red;
    }
    #score {
      position: absolute;
      top: 10px;
      left: 20px;
      font-size: 1.2em;
    }
    #cooldownBarContainer {
      position: absolute;
      top: 10px;
      right: 20px;
      width: 100px;
      height: 10px;
      border: 1px solid white;
      background: #333;
    }
    #cooldownBar {
      height: 100%;
      width: 100%;
      background: lime;
      transition: width 0.1s linear;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <div id="gameOver">Game Over!</div>
  <div id="score">Score: 0</div>
  <div id="cooldownBarContainer"><div id="cooldownBar"></div></div>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const scoreDisplay = document.getElementById("score");
    const cooldownBar = document.getElementById("cooldownBar");

    const player = {
      x: canvas.width / 2 - 25,
      y: canvas.height - 50,
      width: 50,
      height: 50,
      color: "lime",
      speed: 5,
      parryCooldown: 2000, // 2 seconds
      lastParryTime: -Infinity,
      parryWindow: 200, // 0.2 seconds to trigger reflect
    };

    let keys = {};
    let enemies = [];
    let score = 0;
    let parryTime = 0;
    let gameRunning = true;

    document.addEventListener("keydown", (e) => {
      keys[e.key] = true;

      // Handle parry attempt
      if ((e.key === "ArrowUp" || e.key === "w")) {
        const now = Date.now();
        if (now - player.lastParryTime >= player.parryCooldown) {
          parryTime = now;
          player.lastParryTime = now;
        }
      }
    });

    document.addEventListener("keyup", (e) => {
      keys[e.key] = false;
    });

    function spawnEnemy() {
      const size = 30;
      const x = Math.random() * (canvas.width - size);
      const isParryable = Math.random() < 0.2; // 🔁 More rare (20% chance)
      enemies.push({
        x,
        y: -size,
        width: size,
        height: size,
        speed: 3,
        color: isParryable ? "yellow" : "red",
        direction: "down",
        parried: false,
        isParryable,
      });
    }

    function updatePlayer() {
      if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) {
        player.x -= player.speed;
      }
      if ((keys["ArrowRight"] || keys["d"]) && player.x + player.width < canvas.width) {
        player.x += player.speed;
      }
    }

    function updateEnemies() {
      for (let enemy of enemies) {
        enemy.y += enemy.speed * (enemy.direction === "down" ? 1 : -1);
      }

      enemies = enemies.filter(
        (enemy) =>
          enemy.y < canvas.height + enemy.height &&
          enemy.y + enemy.height > -enemy.height
      );
    }

    function checkCollisions() {
      const now = Date.now();

      for (let enemy of enemies) {
        if (enemy.direction === "down") {
          const closeToPlayer =
            enemy.y + enemy.height >= player.y &&
            enemy.y <= player.y + player.height;

          const horizontallyAligned =
            enemy.x < player.x + player.width &&
            enemy.x + enemy.width > player.x;

          const withinParryWindow = now - parryTime <= player.parryWindow;

          if (closeToPlayer && horizontallyAligned) {
            if (enemy.color === "yellow" && withinParryWindow) {
              enemy.direction = "up";
              enemy.parried = true;
              enemy.color = "cyan";
              score++;
              updateScore();
              continue;
            }

            if (!enemy.parried) {
              gameRunning = false;
              document.getElementById("gameOver").style.display = "block";
            }
          }
        }
      }
    }

    function updateScore() {
      scoreDisplay.textContent = "Score: " + score;
    }

    function drawPlayer() {
      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function drawEnemies() {
      for (let enemy of enemies) {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, enemy.width, enemy.height);
      }
    }

    function updateCooldownBar() {
      const now = Date.now();
      const elapsed = now - player.lastParryTime;
      let progress = Math.min(elapsed / player.parryCooldown, 1);
      cooldownBar.style.width = `${progress * 100}%`;
      cooldownBar.style.background = progress === 1 ? "lime" : "orange";
    }

    function gameLoop() {
      if (!gameRunning) return;

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      updatePlayer();
      updateEnemies();
      checkCollisions();

      drawPlayer();
      drawEnemies();
      updateCooldownBar();

      requestAnimationFrame(gameLoop);
    }

    setInterval(() => {
      if (gameRunning) spawnEnemy();
    }, 1000);

    gameLoop();
  </script>
</body>
</html>
