<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PD1</title>
  <style>
    body {
      transition: background-color 0.5s;
      height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .button-container {
      position: absolute;
      top: 20px;
    }

    button {
      margin: 0 5px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="button-container">
    <button onclick="setManualColor('red')">Red</button>
    <button onclick="setManualColor('yellow')">Yellow</button>
    <button onclick="setManualColor('green')">Green</button>
    <button onclick="resumeAuto()">Auto</button>
  </div>

  <script>
    let autoChange = true;
    let timeoutId;

    function pickNumberAndChangeColor() {
      if (!autoChange) return;

      const num = Math.floor(Math.random() * 7); // 0 to 6

      if (num === 0) {
        document.body.style.backgroundColor = "red";
        timeoutId = setTimeout(pickNumberAndChangeColor, 10000);
      } else {
        if (num % 2 === 0) {
          document.body.style.backgroundColor = "yellow";
        } else {
          document.body.style.backgroundColor = "green";
        }
        const delay = Math.random() * (1200 - 500) + 2000;
        timeoutId = setTimeout(pickNumberAndChangeColor, delay);
      }
    }

    function setManualColor(color) {
      autoChange = false;
      clearTimeout(timeoutId);
      document.body.style.backgroundColor = color;
    }

    function resumeAuto() {
      if (!autoChange) {
        autoChange = true;
        pickNumberAndChangeColor();
      }
    }

    pickNumberAndChangeColor();
  </script>
  <a href="index.html">home</a>
</body>
</html>
