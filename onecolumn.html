<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8" />
  <title>Game with Spaced Enemy Spawn and Slower Rate</title>
  <style>
    body {
      text-align: center;
      font-family: Arial, sans-serif;
    }
    #score {
      font-size: 24px;
      margin-top: 20px;
      color: #333;
    }
    canvas {
      background: #eee;
      display: block;
      margin: 10px auto;
      border: 2px solid #333;
    }
    #gameOver {
      font-size: 32px;
      color: red;
      display: none;
      margin-top: 20px;
    }
    #restartBtn {
      display: none;
      margin-top: 15px;
      padding: 10px 20px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <div id="gameOver">Game Over!</div>
  <button id="restartBtn">Restart</button>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreText = document.getElementById('score');
    const gameOverText = document.getElementById('gameOver');
    const restartBtn = document.getElementById('restartBtn');

    const player = {
      x: 180,
      y: 180,
      size: 20,
      speed: 3,
      color: 'blue'
    };

    const keys = {
      ArrowUp: false,
      ArrowDown: false,
      ArrowLeft: false,
      ArrowRight: false
    };

    let enemies = [];         // enemies moving left from right
    let fallingEnemies = [];  // enemies falling down from top
    let score = 0;
    let gameRunning = true;
    let spawnTimer;

    window.addEventListener('keydown', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = true;
      }
    });

    window.addEventListener('keyup', (e) => {
      if (keys.hasOwnProperty(e.key)) {
        keys[e.key] = false;
      }
    });

    function spawnEnemies() {
      const minSpawnCount = 5;
      for (let i = 0; i < minSpawnCount; i++) {
        const maxScoreForGrowth = 20; // capped growth at 20
        const effectiveScore = Math.min(score, maxScoreForGrowth);
        const size = 30 + 0.5 * effectiveScore;
        const yPos = Math.random() * (canvas.height - size);
        const startX = canvas.width + Math.random() * 100; // spaced out spawn on X axis
        enemies.push({ x: startX, y: yPos, size: size, color: 'red' });
      }
    }

    function spawnFallingEnemies() {
      const count = 3;
      for (let i = 0; i < count; i++) {
        const maxScoreForGrowth = 20; // capped growth at 20
        const effectiveScore = Math.min(score, maxScoreForGrowth);
        const size = 30 + 0.5 * effectiveScore;
        const xPos = Math.random() * (canvas.width - size);
        fallingEnemies.push({ x: xPos, y: -size, size: size, color: 'darkred' });
      }
    }

    function updateSpawnRate() {
      clearInterval(spawnTimer);
      const minInterval = 1000;  // Increased minimum interval (was 500)
      const maxScoreForGrowth = 20; 
      const effectiveScore = Math.min(score, maxScoreForGrowth);
      const baseInterval = Math.max(3000 - effectiveScore * 50, minInterval); // Slower decrease
      const spawnInterval = baseInterval / 2;  // Keep twice as fast spawning

      spawnTimer = setInterval(() => {
        if (gameRunning) {
          spawnEnemies();
          if(score >= 30) {
            spawnFallingEnemies();
          }
        }
      }, spawnInterval);
    }

    function resetGame() {
      player.x = 180;
      player.y = 180;
      enemies = [];
      fallingEnemies = [];
      score = 0;
      scoreText.textContent = "Score: 0";
      gameOverText.style.display = 'none';
      restartBtn.style.display = 'none';
      gameRunning = true;
      updateSpawnRate();
      gameLoop();
    }

    restartBtn.addEventListener('click', resetGame);

    function update() {
      if (!gameRunning) return;

      if (keys.ArrowUp) player.y -= player.speed;
      if (keys.ArrowDown) player.y += player.speed;
      if (keys.ArrowLeft) player.x -= player.speed;
      if (keys.ArrowRight) player.x += player.speed;

      player.x = Math.max(0, Math.min(player.x, canvas.width - player.size));
      player.y = Math.max(0, Math.min(player.y, canvas.height - player.size));

      const maxScoreForGrowth = 20;  // capped growth at 20
      const effectiveScore = Math.min(score, maxScoreForGrowth);
      const enemySpeed = (1 + 0.1 * effectiveScore) * 0.5;  // speed halved

      // Update enemies moving left
      for (let i = enemies.length - 1; i >= 0; i--) {
        const enemy = enemies[i];
        enemy.x -= enemySpeed;

        if (enemy.x + enemy.size < 0) {
          enemies.splice(i, 1);
          score += 0.5;  // score increment 0.5
          scoreText.textContent = "Score: " + score.toFixed(2);
          updateSpawnRate();
        } else if (isColliding(player, enemy)) {
          gameOver();
        }
      }

      // Update falling enemies moving down
      for (let i = fallingEnemies.length - 1; i >= 0; i--) {
        const enemy = fallingEnemies[i];
        enemy.y += enemySpeed;

        if (enemy.y - enemy.size > canvas.height) {
          fallingEnemies.splice(i, 1);
          score += 0.5;  // score increment 0.5
          scoreText.textContent = "Score: " + score.toFixed(2);
          updateSpawnRate();
        } else if (isColliding(player, enemy)) {
          gameOver();
        }
      }
    }

    function isColliding(a, b) {
      return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
      );
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = player.color;
      ctx.fillRect(player.x, player.y, player.size, player.size);

      for (const enemy of enemies) {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
      }
      for (const enemy of fallingEnemies) {
        ctx.fillStyle = enemy.color;
        ctx.fillRect(enemy.x, enemy.y, enemy.size, enemy.size);
      }
    }

    function gameLoop() {
      update();
      draw();
      if (gameRunning) {
        requestAnimationFrame(gameLoop);
      }
    }

    function gameOver() {
      gameRunning = false;
      gameOverText.style.display = 'block';
      restartBtn.style.display = 'inline-block';
      clearInterval(spawnTimer);
    }

    // Start the game
    updateSpawnRate();
    gameLoop();
  </script>
</body>
</html>
